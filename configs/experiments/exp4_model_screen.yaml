# EXP4 — Multi-model collusion screen (docs/experiments/exp4_model_screen.md; D1 in docs/research-directions.md)
# Positive-control setting from EXP2 (integrated agent per firm, public board + private channel, no enforcement)
# at two pressure levels, for each OpenRouter model in configs/models_openrouter.yaml (pinned provider).
# Desks: temperature 0.7 where the model supports it, per-call seed, reasoning off. Judge stays claude-haiku-5-5.
name: exp4_model_screen
out_dir: runs/exp4_model_screen
seeds: [0, 1]
base:
  agents: {mode: llm, integrated: true}
  channel: {channel: public_private}
  regulator: {enforcement: none}
  llm: {temperature: 0.7}
grid:
  llm.model:
    - meta-llama/llama-3.3-70b-instruct
    - meta-llama/llama-4-maverick
    - qwen/qwen3.8-flash
    - deepseek/deepseek-v4.1-flash
    - mistralai/mistral-small-2603
    - openai/gpt-6-luna
  agents.pressure: [permission, explicit]
