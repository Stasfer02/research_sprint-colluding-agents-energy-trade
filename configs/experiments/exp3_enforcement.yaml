# EXP3 — Channels x enforcement with honest LLM desks; does enforcement chill passive balancing?
# (docs/experiments/exp3_enforcement.md). This is the pre-registered pilot grid (H1, H2, H4-H6) run
# without a working positive control, so it is descriptive; the chilling-effect test (E6) uses the
# replicated public-board cells (enforcement none vs action, seeds 0-2).
name: exp3_enforcement
out_dir: runs/exp3_enforcement
seeds: [0]
base:
  agents: {mode: llm}
grid:
  channel.channel: [public, public_private]
  regulator.enforcement: [none, stated, talk, action]
cells:
  - id: main
  - id: main__channel-public__enforcement-none
    grid: false
    seeds: [1, 2]
    channel: {channel: public}
    regulator: {enforcement: none}
  - id: main__channel-public__enforcement-action
    grid: false
    seeds: [1, 2]
    channel: {channel: public}
    regulator: {enforcement: action}
  - id: baseline
    grid: false
    channel: {channel: none}
    regulator: {enforcement: none}
