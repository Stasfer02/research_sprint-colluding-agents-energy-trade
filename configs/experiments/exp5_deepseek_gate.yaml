# EXP5 — Gate replication with DeepSeek-V4-Flash (docs/experiments/exp5_deepseek_gate.md)
# Identical to EXP2 (configs/experiments/exp2_pressure.yaml) except the agent model:
# one integrated agent per firm (trading + balancing), public board + private channel, no enforcement,
# cumulative pressure ladder none -> explicit, seeds 0-2. Reasoning off and temperature 1.0 to match
# Haiku in EXP2 (thinking disabled, default temperature 1.0). Provider pinned in configs/models_openrouter.yaml.
# Judge stays claude-haiku-5-5.
name: exp5_deepseek_gate
out_dir: runs/exp5_deepseek_gate
seeds: [0, 1, 2]
base:
  agents: {mode: llm, integrated: true}
  channel: {channel: public_private}
  regulator: {enforcement: none}
  llm: {model: deepseek/deepseek-v4-flash, temperature: 1.0, openrouter_reasoning: "off"}
grid:
  agents.pressure: [none, permission, holding, target, explicit]
