# Market v2 (docs/design-spec.md §13): one dominant firm. Merge into a grid's `base` via the `market:` key.
# Same rules, noise and prices as market v1; only the ownership of balancing capacity changes.
# Firm A owns four 20 MW blocks (80 of 120 MW per direction); B and C one block each (the competitive fringe).
# Equal block sizes keep the published merit order anonymous. With `blocks` set, market.c_up / c_down / K are unused.
# Each block: [MW, upward cost, downward cost] (€/MWh).
market:
  blocks:
    - [[20, 70, 55], [20, 71, 54], [20, 72, 53], [20, 73, 52]]
    - [[20, 78, 48]]
    - [[20, 80, 45]]
